<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic Characteristics Toolkit - Module 3</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="model.js"></script>
</head>
<body style="font-family: sans-serif; max-width: 850px; margin: auto; padding: 16px; background-color: #121212; color: #e0e0e0;">

  <h1 style="color: #ffffff;">Module 3: Second-Order Response</h1>
  <p style="color: #b0b0b0;">Step response of a second-order sensor (y″/ωn² + 2ζy′/ωn + y = Kx). Move ζ and ωn and watch the curve.</p>

  <div style="background: #1e1e1e; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #333;">
    <h3 style="color: #ffffff; margin-top: 0;">Controls</h3>

    <label>Damping ratio (ζ): <b id="zetaValue" style="color: #61afef;">0.5</b> — <b id="caseLabel" style="color: #e5c07b;"></b></label><br>
    <input id="zeta" type="range" min="0.05" max="3" step="0.05" value="0.5" style="width:100%"><br><br>

    <label>Natural frequency (ωn): <b id="wnValue" style="color: #61afef;">2</b> rad/s</label><br>
    <input id="wn" type="range" min="0.5" max="20" step="0.5" value="2" style="width:100%">
  </div>

  <!-- Main Response Plot -->
  <div id="plot" style="width:100%; height:360px; margin-top: 20px; background: #1e1e1e; border-radius: 8px; padding: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #333;"></div>

  <!-- Characteristics read-out -->
  <div style="background: #1e1e1e; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #333; margin-top: 20px;">
    <h3 style="color: #ffffff; margin-top: 0;">Characteristics</h3>
    <p id="charResult" style="font-weight: bold; color: #61afef; line-height: 1.6;"></p>
  </div>

  <!-- Validation checks 4 and 5 (fixed values, independent of the sliders) -->
  <div style="background: #1e1e1e; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #333; margin-top: 20px;">
    <h3 style="color: #ffffff; margin-top: 0;">Validation Checks 4 and 5 (Second-Order Step)</h3>
    <p id="validationResult" style="font-weight: bold; color: #61afef; line-height: 1.6;"></p>
  </div>

<script>
const PASS = '<b style="color: #98c379;">PASS</b>';
const FAIL = '<b style="color: #e06c75;">FAIL</b>';

function caseName(zeta) {
  if (zeta < 1 - ZETA_CRIT_TOL) return 'Underdamped';
  if (zeta <= 1 + ZETA_CRIT_TOL) return 'Critically damped';
  return 'Overdamped';
}

function draw() {
  const zeta = parseFloat(document.getElementById('zeta').value);
  const wn = parseFloat(document.getElementById('wn').value);

  document.getElementById('zetaValue').textContent = zeta;
  document.getElementById('wnValue').textContent = wn;
  document.getElementById('caseLabel').textContent = caseName(zeta);

  // All maths comes from model.js
  const t = timeVector(zeta, wn);
  const y = stepResponse(t, zeta, wn);
  const c = characteristics(zeta, wn);
  const tEnd = t[t.length - 1];

  const traces = [
    { x: t, y: y, mode: 'lines', name: 'Response', line: { color: '#61afef', width: 3 } },
    { x: [0, tEnd], y: [1, 1], mode: 'lines', name: 'Final value', line: { color: '#555555', width: 1, dash: 'dash' } }
  ];

  if (c.tp !== null) {
    traces.push({
      x: [c.tp], y: [1 + c.Mp], mode: 'markers', name: 'Peak',
      marker: { color: '#e06c75', size: 10 }
    });
    document.getElementById('charResult').innerHTML =
      `Damped frequency ωd = ${c.wd.toFixed(3)} rad/s<br>` +
      `Peak time tp = π/ωd = ${c.tp.toFixed(3)} s<br>` +
      `Overshoot Mp = ${(c.Mp * 100).toFixed(1)} % (peak value ${(1 + c.Mp).toFixed(3)})`;
  } else {
    document.getElementById('charResult').innerHTML =
      `No overshoot and no peak time: the response never exceeds the final value.<br>` +
      `<span style="color: #e5c07b;">tp, Mp and ωd exist only for ζ &lt; 1.</span>`;
  }

  const layout = {
    paper_bgcolor: '#1e1e1e',
    plot_bgcolor: '#1e1e1e',
    font: { color: '#e0e0e0' },
    title: { text: 'Step Response y(t)/(KA)', font: { size: 14 } },
    xaxis: { title: 'Time t (s)', gridcolor: '#333333', zerolinecolor: '#555555' },
    yaxis: { title: 'y(t)/(KA)', gridcolor: '#333333', zerolinecolor: '#555555' },
    margin: { t: 30, b: 40, l: 50, r: 20 },
    legend: { orientation: 'h', y: -0.25 }
  };
  Plotly.react('plot', traces, layout);
}

function validate() {
  // Check 4: zeta = 0.5, wn = 2 -> overshoot 16.3 %
  const c4 = characteristics(0.5, 2);
  const y4 = stepResponse(timeVector(0.5, 2), 0.5, 2);
  const sampled4 = Math.max(...y4) - 1;
  const ok4 = Math.abs(c4.Mp - 0.163) < 0.001 && Math.abs(sampled4 - 0.163) < 0.002;

  // Check 5: zeta = 1 -> no overshoot
  const c5 = characteristics(1, 2);
  const y5 = stepResponse(timeVector(1, 2), 1, 2);
  const ok5 = Math.max(...y5) <= 1 && c5.Mp === null;

  document.getElementById('validationResult').innerHTML =
    `Check 4 (ζ = 0.5): overshoot = ${(c4.Mp * 100).toFixed(1)} % (Expected: 16.3 %), ` +
    `peak read from the curve = ${(sampled4 * 100).toFixed(1)} % — ${ok4 ? PASS : FAIL}<br>` +
    `Check 5 (ζ = 1): maximum of curve = ${Math.max(...y5).toFixed(4)} (Expected: no overshoot, ≤ 1) — ${ok5 ? PASS : FAIL}`;
}

document.getElementById('zeta').addEventListener('input', draw);
document.getElementById('wn').addEventListener('input', draw);
validate();
draw();
</script>
</body>
</html>
